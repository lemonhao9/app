name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          VITE_SOCKET_URL: https://homecyclhome.lemonhao.fr
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' "$VPS_HOST" "$VPS_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Copy frontend build to the VPS
        run: rsync -az --delete frontend/dist/ vps:/opt/homecycl-home/frontend/dist/
      - name: Deploy on the VPS
        run: |
          ssh vps 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/homecycl-home
          git pull --ff-only origin main
          compose() { docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production "$@"; }
          compose pull --ignore-buildable
          compose build --pull
          compose run --rm --no-deps --user root api find /app/uploads ! -user node -exec chown node:node {} +
          compose up -d
          docker image prune -f
          EOF
      - name: Health check
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS -L https://homecyclhome.lemonhao.fr/api/v1/health; then
              exit 0
            fi
            echo "API pas encore prête (tentative $attempt/12)"
            sleep 5
          done
          exit 1
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
